<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>K-tube light</title>
<link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/1/19/Google_Classroom_Logo.svg">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
/* ===================== style.css（そのまま） ===================== */
*{box-sizing:border-box}
html,body{height:0%;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;background:#fff;color:#111}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: #fff;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  padding: 8px 16px;
  gap: 12px;
  height: 64px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

body { padding-top: 64px; }

.logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .icon{width:36px;height:36px;border-radius:6px;background:#ff0000;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.search{flex:1;display:flex;justify-content:center}
.search input{width:100%;max-width:720px;padding:10px 14px;border-radius:20px;border:1px solid #ddd;outline:none}
.actions{display:flex;gap:12px;align-items:center}
main{display:flex;gap:20px;padding:16px;align-items:flex-start}
.content{flex:1}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{cursor:pointer}
.thumb{position:relative;border-radius:6px;overflow:hidden;background:#eee;aspect-ratio:16/9;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.meta{display:flex;gap:12px;margin-top:8px}
.channel-thumb{width:36px;height:36px;border-radius:50%;flex:0 0 36px;background:#ddd;overflow:hidden}
.meta .info{flex:1}
.meta .info .title{font-weight:600;line-height:1.2;margin-bottom:6px}
.meta .info .sub{color:#606060;font-size:13px}
.watch-container{display:flex;gap:20px}
.main-col{flex:0 0 60%}
.side-col{flex:0 0 40%}
.player-box{background:#000;aspect-ratio:16/9;border-radius:6px;overflow:hidden}
.player-meta{margin-top:12px}
.player-meta h1{font-size:18px;margin:0 0 8px 0}
.stats{color:#606060;font-size:13px;margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap}
.channel-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;margin-top:12px}
.channel-row img{width:48px;height:48px;border-radius:50%;overflow:hidden}
.channel-row .ch-info{flex:1}
.btn-sub{background:#cc0000;color:#fff;padding:8px 12px;border-radius:16px;font-weight:700;cursor:pointer}
.comments{margin-top:12px}
.comment{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.comment img{width:36px;height:36px;border-radius:50%}
.comment .c-body{flex:1}
.comment .c-body .name{font-weight:700;font-size:13px}
.comment .c-body .text{color:#333;margin-top:6px}
.related-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f5f5f5;cursor:pointer}
.related-thumb{position:relative;width:168px;flex:0 0 168px;aspect-ratio:16/9;overflow:hidden;border-radius:6px;}
.related-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.related-info{flex:1}
.related-info .title{font-size:14px;font-weight:600}

@media(max-width:900px){
  main{padding:12px}
  .watch-container{flex-direction:column}
  .main-col,.side-col{flex:1 1 100%}
  .related-thumb{width:120px;flex:0 0 120px;aspect-ratio:16/9;}
  .search input{max-width:420px}
}
.watch-container { display: flex; gap: 20px; height: calc(100vh - 64px - 32px); }
.main-col { flex: 0 0 60%; display: flex; flex-direction: column; overflow-y: auto; padding-right: 4px; }
.side-col { flex: 0 0 40%; display: flex; flex-direction: column; overflow-y: auto; padding-left: 4px; }
.player-box { flex: 0 0 auto; }
.comments { flex: 1 1 auto; overflow-y: auto; }
.btn-sub.disabled { opacity: 0.4; pointer-events: none; }

.menu-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; transition: background 0.2s; }
.menu-btn:hover { background: #f0f0f0; }
.menu-btn svg { width: 24px; height: 24px; fill: #0f0f0f; }

.sidebar-fixed {
  position: fixed; top: 64px; left: 0; bottom: 0; width: 72px;
  background: #fff; box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 1000;
  transform: translateX(0); transition: transform 0.3s ease, width 0.3s ease; overflow-y: auto;
}
.sidebar-fixed.hidden { transform: translateX(-100%); }
.sidebar-fixed:hover { width: 240px; }
.content-main { margin-left: 72px; transition: margin-left 0.3s ease; }
.sidebar-fixed.hidden ~ .content-main { margin-left: 0; }
body.dark-mode .sidebar-fixed { background: #1e1e1e; color: #eee; }

.sidebar-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 12px 8px; margin: 4px 8px; border-radius: 12px; cursor: pointer;
  transition: background 0.2s; text-align: center; font-size: 12px; color: #0f0f0f;
}
.sidebar-item:hover { background: #f2f2f2; }
.sidebar-item.active { background: #fee2e2; color: #cc0000; }
.sidebar-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: #606060; }
.sidebar-item.active svg { fill: #cc0000; }

@media (max-width: 900px) {
  .sidebar-fixed { display: none; }
  .content-main { margin-left: 0 !important; width: 100% !important; }
}

#gameGrid .card .thumb img { aspect-ratio: 16/9; object-fit: cover; }

.play-fullscreen {
  position: fixed; top: 64px; left: 72px; right: 0; bottom: 0;
  z-index: 20; background: #000; overflow: hidden;
}
body.sidebar-hidden .play-fullscreen { left: 0; }
.play-fullscreen iframe { width: 100%; height: 100%; border: none; }
@media (max-width: 900px) { .play-fullscreen { left: 0; } }

body.dark-mode { background: #0f0f0f; color: #e0e0e0; }
body.dark-mode header { background: #1e1e1e; border-bottom: 1px solid #333; }
body.dark-mode .sidebar-fixed { background: #1e1e1e; }
body.dark-mode .sidebar-item:hover { background: #333; }
body.dark-mode .card { background: #1e1e1e; }
body.dark-mode .video-grid,
body.dark-mode .watch-container { color: #e0e0e0; }

.setting-group { margin-bottom: 32px; padding: 20px; background: #f8f9fa; border-radius: 12px; border: 1px solid #eee; }
.setting-group h2 { font-size: 18px; margin: 0 0 16px; color: #0f0f0f; }
.setting-label { display: flex; align-items: center; gap: 12px; font-size: 15px; cursor: pointer; }
.setting-label input { width: 18px; height: 18px; }
.danger-btn { padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 12px; }
.danger-btn:hover { background: #c82333; }

/* ===================== K-tube light 追加分 ===================== */
.light-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  background: linear-gradient(135deg, #ff0000, #cc0000);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  border-radius: 4px;
  letter-spacing: 0.4px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.18);
  line-height: 1;
  font-family: system-ui, -apple-system, sans-serif;
  user-select: none;
}
body.dark-mode .light-badge {
  background: linear-gradient(135deg, #ff3333, #cc0000);
}
</style>
</head>

<script>
/* ============================================================
   K-tube light (single-file)
   Based on main.js + play.js + tools.js
   Only difference from original: BASE_URL prefixes + light badge
   ============================================================ */

const BASE_URL = 'https://k-tube-for-public-release-rpwm.onrender.com';

const PIPED_API_BASE = `${BASE_URL}/piped`;
const INVIDIOUS_API_BASE = `${BASE_URL}/invidious`;

const MAX_RESULTS = 12;
const el = id => document.getElementById(id);
const app = el('app');
const searchInput = el('searchInput');
const homeBtn = el('homeBtn');

let channelThumbCache = {};
let homeLoading = false;
let observerMap = new Map();
let commentsPageToken = {};

// 相対 embedUrl を BASE_URL に解決
function resolveEmbedUrl(url) {
  if (!url) return url;
  if (/^https?:\/\//i.test(url) || url.startsWith('//')) return url;
  if (url.startsWith('/')) return BASE_URL + url;
  return BASE_URL + '/' + url;
}

// ─────────────────────────────────────────────
const _numFmt = new Intl.NumberFormat('en-US');
function fmtNum(n) {
  if (n == null || isNaN(n)) return '0';
  return _numFmt.format(Number(n));
}

function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return s + '秒前';
  if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+'時間前';
  if(s<2592000) return Math.floor(s/86400)+'日前';
  if(s<31536000) return Math.floor(s/2592000)+'ヶ月前';
  return Math.floor(s/31536000)+'年以上前';
}

async function rawFetchJson(url, timeoutMs = 12000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: controller.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

// ─────────────────────────────────────────────
function normalizeInvidious(endpoint, data) {
  if (endpoint.startsWith('/trending') || endpoint.startsWith('/search')) {
    const arr = Array.isArray(data) ? data : (data.items || data.videos || []);
    return arr.map(v => {
      const vid = v.videoId || '';
      return {
        url: `/watch?v=${vid}`,
        title: v.title || '',
        thumbnail: `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`,
        uploaderName: v.author || '',
        uploaderUrl: `/channel/${v.authorId || ''}`,
        views: v.viewCount || 0,
        uploaded: v.published ? new Date(v.published * 1000).toISOString() : '',
        uploadedDate: v.published ? new Date(v.published * 1000).toISOString() : '',
        duration: v.lengthSeconds || 0,
        shortDescription: v.description || ''
      };
    });
  }
  if (endpoint.startsWith('/channel/')) {
    const vids = (data.latestVideos || []).map(v => {
      const vid = v.videoId || '';
      return {
        url: `/watch?v=${vid}`,
        title: v.title || '',
        thumbnail: `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`,
        uploaderName: v.author || data.author || '',
        uploaderUrl: `/channel/${v.authorId || data.authorId || ''}`,
        views: v.viewCount || 0,
        uploaded: v.published ? new Date(v.published * 1000).toISOString() : '',
        uploadedDate: v.published ? new Date(v.published * 1000).toISOString() : ''
      };
    });
    return {
      name: data.author || '',
      description: data.description || '',
      avatarUrl: toYt3Avatar(data.authorThumbnails?.slice(-1)[0]?.url || '', 176),
      subscriberCount: data.subCount || 0,
      relatedStreams: vids,
      videos: vids
    };
  }
  if (endpoint.startsWith('/comments/')) {
    return {
      comments: (data.comments || []).map(c => ({
        author: c.author || '',
        thumbnail: c.authorThumbnails?.[0]?.url || '',
        commentText: c.content || '',
        commentedTime: c.publishedText || '',
        likeCount: c.likeCount || 0
      })),
      nextpage: data.continuation || null
    };
  }
  if (endpoint.startsWith('/streams/')) {
    const vid = endpoint.split('/').pop();
    return {
      title: data.title || '',
      description: data.description || '',
      viewCount: data.viewCount || 0,
      likeCount: data.likeCount || 0,
      published: data.published ? new Date(data.published * 1000).toISOString() : '',
      uploader: data.author || '',
      channelId: data.authorId || '',
      uploaderAvatar: data.authorThumbnails?.slice(-1)[0]?.url || '',
      thumbnail: `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`,
      lengthSeconds: data.lengthSeconds || 0,
      formatStreams: data.formatStreams || [],
      adaptiveFormats: data.adaptiveFormats || [],
      relatedStreams: (data.recommendedVideos || []).map(v => ({
        url: `/watch?v=${v.videoId}`,
        title: v.title,
        thumbnail: `https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg`,
        uploaderName: v.author,
        uploaderUrl: `/channel/${v.authorId}`,
        views: v.viewCount,
        uploaded: v.published ? new Date(v.published * 1000).toISOString() : ''
      }))
    };
  }
  return data;
}

async function pipedFetch(endpoint, params = {}) {
  const path = endpoint.startsWith('/') ? endpoint : '/' + endpoint;
  const qs = new URLSearchParams(params).toString();
  const full = qs ? `${path}?${qs}` : path;

  const pipedUrl = `${PIPED_API_BASE}${full}`;
  const invUrl   = `${INVIDIOUS_API_BASE}${full}`;

  try {
    const result = await Promise.any([
      rawFetchJson(pipedUrl, 6000).then(data => ({ source: 'piped', data })),
      rawFetchJson(invUrl, 6000).then(data => ({
        source: 'invidious',
        data: normalizeInvidious(endpoint, data)
      }))
    ]);
    console.log(`[pipedFetch] ${endpoint} → ${result.source} 成功`);
    return result.data;
  } catch (e) {
    console.error(`[pipedFetch] ${endpoint} → 全滅:`, e.message);
    throw new Error('Piped / Invidious の両方で取得に失敗しました');
  }
}

function toYt3Avatar(url, size = 88) {
  if (!url || typeof url !== 'string') return '';
  if (url.startsWith('data:')) return '';
  try {
    if (url.includes('yt3.ggpht.com')) {
      return url.replace(/=s\d+[^=]*$/, `=s${size}-c-k-c0x00ffffff-no-rj`);
    }
    const u = new URL(url, location.origin);
    const ytcIndex = u.pathname.indexOf('/ytc/');
    if (ytcIndex !== -1) {
      const ytcPath = u.pathname.slice(ytcIndex);
      const query = u.search || '';
      return `https://yt3.ggpht.com${ytcPath}${query}`;
    }
    if (url.includes('ggpht.com') || url.includes('googleusercontent.com')) {
      return `https://yt3.ggpht.com${u.pathname}${u.search}`;
    }
    return '';
  } catch (e) {
    console.warn('toYt3Avatar failed:', url, e);
    return '';
  }
}

async function getChannelThumbPiped(channelId) {
  if (channelThumbCache[channelId]) return channelThumbCache[channelId];
  try {
    const data = await pipedFetch(`/channel/${channelId}`);
    const rawThumb = data.avatarUrl || '';
    const thumb = toYt3Avatar(rawThumb, 88);
    channelThumbCache[channelId] = thumb;
    return thumb;
  } catch (e) {
    console.warn('channel thumb failed', e);
    return '';
  }
}

async function runWithConcurrency(tasks, limit = 6) {
  const results = [];
  let idx = 0;
  const workers = Array.from({ length: Math.min(limit, tasks.length) }, async () => {
    while (idx < tasks.length) {
      const i = idx++;
      try { results[i] = await tasks[i](); } catch (e) { results[i] = null; }
    }
  });
  await Promise.all(workers);
  return results;
}

async function fillChannelThumbs(cards) {
  const idToImgs = new Map();
  cards.forEach(card => {
    const chId = card.querySelector('.ch-link')?.dataset.channel;
    const img = card.querySelector('.channel-thumb img');
    if (!chId || !img) return;
    if (!idToImgs.has(chId)) idToImgs.set(chId, []);
    idToImgs.get(chId).push(img);
  });
  const entries = [...idToImgs.entries()];
  await runWithConcurrency(
    entries.map(([chId, imgs]) => async () => {
      const thumb = await getChannelThumbPiped(chId);
      if (thumb) imgs.forEach(img => { img.src = thumb; });
    }), 6
  );
}

// ─────────────────────────────────────────────
window.addEventListener('hashchange', renderByHash);
homeBtn.addEventListener('click', () => {
  if (!location.hash || location.hash === '#') {
    renderHome();
    toggleFixedSidebar(true);
    updateSidebarActive();
  } else {
    location.hash = '';
  }
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') performSearch(searchInput.value.trim());
});
renderByHash();

function renderByHash() {
  const h = location.hash.slice(1);
  document.body.classList.remove('watch-page');

  if (!h) {
    renderHome();
    toggleFixedSidebar(true);
  } else {
    const [k, v] = h.split('=');
    if (k === 'watch') {
      renderWatch(v);
      document.body.classList.add('watch-page');
      toggleFixedSidebar(false);
    } else if (k === 'channel') {
      renderChannel(v);
      toggleFixedSidebar(true);
    } else if (k === 'search') {
      searchInput.value = decodeURIComponent(v || '');
      performSearch(decodeURIComponent(v || ''));
      toggleFixedSidebar(true);
    } else if (k === 'games') {
      renderGames();
      toggleFixedSidebar(true);
    } else if (k === 'tools') {
      renderTools();
      toggleFixedSidebar(true);
    } else if (k === 'history') {
      renderHistory();
      toggleFixedSidebar(true);
    } else if (k === 'settings') {
      renderSettings();
      toggleFixedSidebar(true);
    } else if (k === 'about') {
      renderAbout();
      toggleFixedSidebar(true);
    } else if (k === 'contact') {
      renderContact();
      toggleFixedSidebar(true);
    } else if (k === 'playgame') {
      const url = decodeURIComponent(v || '');
      if (typeof window.renderGamePlay === 'function') {
        window.renderGamePlay({ embedUrl: url, title: 'ゲーム' });
      } else {
        app.innerHTML = `<div class="play-fullscreen"><iframe src="${resolveEmbedUrl(url)}" frameborder="0" allowfullscreen></iframe></div>`;
      }
      document.body.classList.add('watch-page');
      toggleFixedSidebar(false);
    } else if (k === 'playtool') {
      const url = decodeURIComponent(v || '');
      if (typeof window.renderToolPlay === 'function') {
        window.renderToolPlay({ embedUrl: url, title: 'ツール' });
      } else {
        app.innerHTML = `<div class="play-fullscreen"><iframe src="${resolveEmbedUrl(url)}" frameborder="0" allowfullscreen></iframe></div>`;
      }
      document.body.classList.add('watch-page');
      toggleFixedSidebar(false);
    } else {
      renderHome();
      toggleFixedSidebar(true);
    }
  }
}

async function loadHome() {
  if (homeLoading) return;
  homeLoading = true;
  const grid = el('videoGrid');
  try {
    const data = await pipedFetch('/trending', { region: 'JP' });
    const items = data || [];
    const frag = document.createDocumentFragment();
    const cards = [];
    for (const item of items) {
      const card = makeVideoCard(item);
      cards.push(card);
      frag.appendChild(card);
    }
    grid.appendChild(frag);
    fillChannelThumbs(cards);
  } catch (e) {
    console.error(e);
    grid.innerHTML += `<div style="color:#c00; padding:16px; text-align:center;">読み込み失敗: ${escapeHtml(e.message)}</div>`;

function makeVideoCard(item) {
  const vid = item.url?.split('v=')[1] || item.url?.split('/').pop() || '';
  const title = item.title || '';
  const th = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
  const thHi = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
  const chId = item.uploaderUrl?.split('/').pop() || '';
  const chTitle = item.uploaderName || '';
  const views = item.views || 0;
  const publishedAt = item.uploadedDate || item.uploaded || '';

  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <div class="thumb" data-vid="${vid}">
      <img src="${th}" data-hi="${thHi}" alt="" loading="lazy" decoding="async"
           onload="if(this.dataset.hi&&this.src.includes('mqdefault')){const i=new Image();i.onload=()=>{this.src=this.dataset.hi;};i.src=this.dataset.hi;}">
    </div>
    <div class="meta">
      <div class="channel-thumb"><img src="" alt="" loading="lazy" decoding="async"></div>
      <div class="info">
        <div class="title">${escapeHtml(title)}</div>
        <div class="sub">
          <a href="#channel=${chId}" data-channel="${chId}" class="ch-link">${escapeHtml(chTitle)}</a>
          ・ ${fmtNum(views)} 回視聴 ・ ${timeAgo(publishedAt)}
        </div>
      </div>
    </div>
  `;
  div.querySelector('.thumb').addEventListener('click', () => {
    try {
      const thumbImg = div.querySelector('.channel-thumb img');
      let channelThumb = thumbImg?.src || '';
      if (!channelThumb && chId && channelThumbCache[chId]) channelThumb = channelThumbCache[chId];
      sessionStorage.setItem('ktube_pending_watch', JSON.stringify({
        videoId: vid, title, thumbnail: th,
        channelName: chTitle, channelId: chId,
        channelThumb: channelThumb || '',
        views, publishedAt
      }));
    } catch (e) {}
    location.hash = `watch=${vid}`;
  });
  div.querySelector('.ch-link').addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    location.hash = `channel=${chId}`;
  });
  return div;
}

async function performSearch(q) {
  if (!q) return renderHome();
  location.hash = `search=${encodeURIComponent(q)}`;
  app.innerHTML = `
    <section>
      <div style="margin:12px 0;font-weight:700;font-size:18px">検索結果: ${escapeHtml(q)}</div>
      <div class="video-grid" id="videoGrid"></div>
      <div id="searchSentinel" style="height:32px"></div>
    </section>
  `;
  const grid = el('videoGrid');
  let loading = false;
  const loadMore = async () => {
    if (loading) return;
    loading = true;
    try {
      const data = await pipedFetch('/search', { q, filter: 'videos' });
      let items = [];
      if (Array.isArray(data)) items = data;
      else if (data && typeof data === 'object') items = data.items || data.results || data.videos || data || [];
      const frag = document.createDocumentFragment();
      const cards = [];
      for (const item of items) {
        const card = makeVideoCard(item);
        cards.push(card);
        frag.appendChild(card);
      }
      grid.appendChild(frag);
      fillChannelThumbs(cards);
    } catch (e) {
      console.error(e);
      grid.innerHTML += `<div style="color:#c00">読み込み失敗: ${escapeHtml(e.message)}</div>`;
    } finally {
      loading = false;
    }
  };
  const sentinel = el('searchSentinel');
  const io = new IntersectionObserver(entries => {
    entries.forEach(ent => { if (ent.isIntersecting) loadMore(); });
  }, { rootMargin: '800px' });
  io.observe(sentinel);
  observerMap.set('search', io);
  loadMore();
}

async function setupComments(videoId) {
  const list = document.getElementById('commentsList');
  if (!list) return;
  list.innerHTML = '<div style="padding: 20px; text-align: center; color: #606060;">コメントを読み込んでいます...</div>';
  commentsPageToken[videoId] = null;
  let loading = false;
  let hasMore = true;
  const loadMore = async () => {
    if (loading || !hasMore) return;
    loading = true;
    try {
      const params = { sort_by: 'top' };
      if (commentsPageToken[videoId]) params.nextpage = commentsPageToken[videoId];
      const res = await pipedFetch(`/comments/${videoId}`, params);
      commentsPageToken[videoId] = res.nextpage || null;
      hasMore = !!res.nextpage && res.nextpage !== null;
      if (list.innerHTML.includes('読み込んでいます')) list.innerHTML = '';
      if (res.comments && res.comments.length > 0) {
        res.comments.forEach(c => {
          const rawThumb = c.thumbnail || '';
          const proxiedThumb = toYt3Avatar(rawThumb, 40)
            || (rawThumb ? `${BASE_URL}/thumb-proxy?url=${encodeURIComponent(rawThumb)}` : '')
            || 'https://www.gstatic.com/youtube/img/no_thumbnail_140-vflXmJqzd.png';
          const div = document.createElement('div');
          div.className = 'comment';
          div.innerHTML = `
            <img src="${proxiedThumb}" alt=""
                 style="width:40px; height:40px; border-radius:50%; object-fit: cover; flex-shrink:0;"
                 loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'; this.onerror=null;">
            <div class="c-body">
              <div class="name" style="display:flex; align-items:center; gap:6px; font-size:13px;">
                <span style="font-weight:500;">${escapeHtml(c.author || '匿名ユーザー')}</span>
                <span style="color:#606060; font-size:12px;">${timeAgo(c.commentedTime || '')}</span>
              </div>
              <div class="text" style="margin-top:4px; line-height:1.4; font-size:14px; white-space: pre-wrap; word-break: break-word; color:#0f0f0f;">${escapeHtml(c.commentText || '(内容がありません)')
                .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
                .replace(/\r?\n/g, '<br>')
                .replace(/^(?:\s|　|<br>)+/gi, '')}</div>
            </div>`;
          list.appendChild(div);
        });
      }
      if (list.children.length === 0 && !hasMore) {
        list.innerHTML = '<div style="padding: 20px; text-align: center; color: #606060; font-size:14px;">コメントは非表示に設定されているか、コメントがありません</div>';
      }
    } catch (e) {
      console.error('コメント読み込みエラー:', e);
      list.innerHTML += `<div style="color:#c00; padding:12px; font-size:14px;">コメントの読み込みに失敗しました</div>`;
    } finally {
      loading = false;
    }
  };
  await loadMore();
  const sentinel = document.getElementById('commentsSentinel');
  if (sentinel) {
    const io = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && hasMore) loadMore();
    }, { root: document.querySelector('.comments'), rootMargin: '400px 0px 200px 0px' });
    io.observe(sentinel);
    observerMap.set(`comments_${videoId}`, io);
  }
}

let _apiListCache = null;
async function getCachedApiList() {
  if (_apiListCache) return _apiListCache;
  try {
    const cached = sessionStorage.getItem('ktube_api_list');
    if (cached) { _apiListCache = JSON.parse(cached); return _apiListCache; }
  } catch (e) {}
  try {
    const res = await fetch(`${BASE_URL}/API.json`);
    if (!res.ok) throw new Error('API.json fetch failed');
    const list = await res.json();
    _apiListCache = list;
    try { sessionStorage.setItem('ktube_api_list', JSON.stringify(list)); } catch (e) {}
    return list;
  } catch (e) {
    console.warn('API.json 取得失敗:', e);
    return ["https://splendid-jelly-e731bd.netlify.app/.netlify/functions"];
  }
}

async function fetchFastestNetlify(videoId) {
  try {
    const apiList = await getCachedApiList();
    if (!Array.isArray(apiList) || apiList.length === 0) throw new Error('API.json が空です');
    const requests = apiList.map(base =>
      fetch(`${base}/video?v=${videoId}`).then(res => {
        if (!res.ok) throw new Error('response not ok');
        return res.json();
      })
    );
    const fastest = await Promise.any(requests);
    return fastest;
  } catch (err) {
    console.warn('全API失敗:', err);
    return null;
  }
}

    const title = metaData.title || pending?.title || `動画（ID: ${videoId}）`;
    const views = fmtNum(metaData.viewCount ?? metaData.views ?? pending?.views ?? 0);
    const likes = fmtNum(metaData.likeCount ?? 0);
    let uploaded = '---';
    if (metaData.published || metaData.uploadDate || metaData.uploaded) {
      try { uploaded = timeAgo(new Date(metaData.published || metaData.uploadDate || metaData.uploaded).toISOString()); } catch {}

    rawDesc = rawDesc.trim().replace(/^\s+|\s+$/g, '').replace(/^(?:\r\n|\r|\n|　)+/, '').replace(/\s{2,}/g, ' ');

    }, 0);

    let chName = metaData.uploader || metaData.author || metaData.channelName || metaData.uploaderName || pending?.channelName || '不明';
    let chId = metaData.channelId || metaData.authorId || (metaData.uploaderUrl?.split('/').pop() || '') || pending?.channelId || '';
    let chThumb = toYt3Avatar(metaData.uploaderAvatar || metaData.avatar || '', 88);
    let subscriberCount = metaData.subscriberCount ?? 0;

    const chLinkEl = document.getElementById('watchChLink');
    if (chLinkEl) {
      chLinkEl.textContent = chName;
      chLinkEl.href = chId ? `#channel=${chId}` : '#';
      chLinkEl.addEventListener('click', e => {
        e.preventDefault();
        if (chId) location.hash = `channel=${chId}`;
      });
    }
    if (chThumb) { const img = document.getElementById('watchChThumb'); if (img) img.src = chThumb; }
    const subsEl0 = document.getElementById('watchChSubs');
    if (subsEl0) subsEl0.textContent = (typeof subscriberCount === 'number' ? fmtNum(subscriberCount) : '---') + ' 人の登録者';

    if (chId) {
      (async () => {
        try {
          const thumb = await getChannelThumbPiped(chId);
          if (thumb) { const img = document.getElementById('watchChThumb'); if (img) img.src = thumb; }
        } catch (e) {}
        try {
          const channelData = await pipedFetch(`/channel/${chId}`);
          if (channelData) {
            if (channelData.name) {
              const link = document.getElementById('watchChLink');
              if (link) link.textContent = channelData.name;
            }
            if (typeof channelData.subscriberCount === 'number' && channelData.subscriberCount > 0) {
              const subsEl = document.getElementById('watchChSubs');
              if (subsEl) subsEl.textContent = `${fmtNum(channelData.subscriberCount)} 人の登録者`;
            } else if (channelData.subscriberCount === -1 || channelData.subscriberCount === null) {
              const subsEl = document.getElementById('watchChSubs');
              if (subsEl) subsEl.textContent = '非公開';
            }
          }
        } catch (e) {}
      })();
    }

    if (title) {
      addToHistory(videoId, title, metaData.thumbnail || pending?.thumbnail || '', chName, metaData.uploaderUrl || (chId ? `/channel/${chId}` : ''));
    }

    if (relatedList) {
      (async () => {
        try {
          let items = [];
          let searchQuery = metaData.title || title || videoId;
          if (metaData.uploader || metaData.uploaderName) searchQuery += ' ' + (metaData.uploader || metaData.uploaderName);
          const relatedData = await pipedFetch('/search', { q: searchQuery, filter: 'videos' });
          items = Array.isArray(relatedData) ? relatedData : (relatedData?.items || relatedData?.results || relatedData?.videos || []);
          items = items.filter(item => {
            const relVid = item.url?.split('v=')[1] || item.url?.split('/').pop() || '';
            return relVid && relVid !== videoId;
          });
          if (items.length < 6) {
            const fallback = await pipedFetch('/search', { q: metaData.title || title || videoId });
            let more = Array.isArray(fallback) ? fallback : (fallback?.items || fallback?.results || fallback?.videos || []);
            more = more.filter(item => {
              const relVid = item.url?.split('v=')[1] || item.url?.split('/').pop() || '';
              return relVid && relVid !== videoId;
            });
            items = [...items, ...more];
          }
          const seen = new Set();
          items = items.filter(item => {
            const relVid = item.url?.split('v=')[1] || item.url?.split('/').pop() || '';
            if (seen.has(relVid)) return false;
            seen.add(relVid);
            return true;
          });
          const finalItems = items.slice(0, 6);
          if (finalItems.length) {
            relatedList.innerHTML = '';
            finalItems.forEach(item => {
              const relVid = item.url?.split('v=')[1] || item.url?.split('/').pop() || '';
              const thumb = `https://i.ytimg.com/vi/${relVid}/mqdefault.jpg`;
              const div = document.createElement('div');
              div.className = 'related-item';
              div.innerHTML = `
                <div class="related-thumb">
                  <img src="${thumb}" alt="" loading="lazy" decoding="async"
                    onerror="this.src='https://i.ytimg.com/vi/${relVid}/mqdefault.jpg'">
                </div>
                <div class="related-info">
                  <div class="title">${escapeHtml(item.title || '(タイトルなし)')}</div>
                  <div style="color:#606060;font-size:13px">
                    ${escapeHtml(item.uploaderName || item.uploader || '不明')} ・ ${fmtNum(item.views || 0)} 回
                  </div>
                </div>`;
              div.addEventListener('click', () => {
                try {
                  sessionStorage.setItem('ktube_pending_watch', JSON.stringify({
                    videoId: relVid, title: item.title || '', thumbnail: thumb,
                    channelName: item.uploaderName || item.uploader || '',
                    channelId: item.uploaderUrl?.split('/').pop() || '',
                    channelThumb: '', views: item.views ?? null,
                    publishedAt: item.uploaded || item.uploadedDate || null
                  }));
                } catch (e) {}
                location.hash = `watch=${relVid}`;
              });
              relatedList.appendChild(div);
            });
          } else {
            relatedList.innerHTML = '<div style="padding:20px; color:#606060;">関連動画が見つかりませんでした</div>';
          }
        } catch (e) {
          console.error('関連動画取得失敗:', e);
          relatedList.innerHTML = '<div style="padding:20px; color:#c00;">関連動画の読み込みに失敗しました</div>';
        }
      })();
    }
  } catch (fatalErr) {
    console.error('renderWatch 全体エラー:', fatalErr);
    app.innerHTML = `
      <div style="padding:40px; text-align:center; color:#c00;">
        <h2>再生ページの読み込みに失敗しました</h2>
        <p>${escapeHtml(fatalErr.message || '不明なエラー')}</p>
        <p style="margin-top:16px;">
          公式YouTubeプレイヤーなら再生できる可能性があります。<br>
          <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" style="color:#065fd4;">YouTubeで開く</a>
        </p>
      </div>`;
  }
}

function normalizeMetadata(data, source) {
  const ch = data.channel || {};
  function parseViewCount(v) {
    if (typeof v === 'number') return v;
    if (typeof v !== 'string') return 0;
    const cleaned = v.replace(/[^\d]/g, '');
    return cleaned ? parseInt(cleaned, 10) : 0;
  }
  function parseLikeCount(v) {
    if (typeof v === 'number') return v;
    if (typeof v !== 'string') return 0;
    const cleaned = v.replace(/[^\d]/g, '');
    return cleaned ? parseInt(cleaned, 10) : 0;
  }
  function parsePublished(v) {
    if (!v) return '';
    if (typeof v === 'number') return new Date(v * 1000).toISOString();
    if (typeof v === 'string') {
      const d = new Date(v.replace(/\//g, '-'));
      if (!isNaN(d.getTime())) return d.toISOString();
      return v;
    }
    return '';
  }
  return {
    title: data.title || data.name || '',
    description: data.description || data.desc || data.shortDescription || '',
    viewCount: parseViewCount(data.viewCount || data.views || data.view_count || 0),
    likeCount: parseLikeCount(data.likeCount || data.likes || 0),
    published: parsePublished(data.published || data.uploadDate || data.uploaded || data.dateText || data.released || ''),
    uploader: data.uploader || data.author || data.channelName || ch.name || '',
    channelId: data.channelId || data.authorId || ch.id || '',
    uploaderAvatar: data.uploaderAvatar || data.avatar || data.authorThumbnails?.slice(-1)[0]?.url || ch.avatar || '',
    thumbnail: data.thumbnail || data.videoThumbnails?.find(t => t.quality === 'maxres')?.url || data.videoThumbnails?.[0]?.url || '',
    lengthSeconds: data.lengthSeconds || data.duration || 0,
    subscriberCount: (() => {
      if (typeof data.subscriberCount === 'number') return data.subscriberCount;
      if (typeof data.subCount === 'number') return data.subCount;
      const subsStr = data.subs || ch.subs || data.subCountText || '';
      if (!subsStr) return 0;
      const m = subsStr.match(/([\d.,]+)\s*([万億MKB]?)/);
      if (!m) return 0;
      const num = parseFloat(m[1].replace(/,/g, ''));
      const unit = m[2];
      if (unit === '万') return Math.round(num * 10000);
      if (unit === '億') return Math.round(num * 100000000);
      if (unit === 'M') return Math.round(num * 1000000);
      if (unit === 'K') return Math.round(num * 1000);
      if (unit === 'B') return Math.round(num * 1000000000);
      return Math.round(num);
    })(),
    formatStreams: data.formatStreams || data.videoFormats || [],
    adaptiveFormats: data.adaptiveFormats || [],
    relatedStreams: data.related || data.recommendedVideos || [],
    source
  };
}

async function renderChannel(channelId) {
  app.innerHTML = `<div>チャンネル読み込み中…</div>`;
  try {
    const data = await pipedFetch(`/channel/${channelId}`);
    if (!data || !data.name) throw new Error('チャンネルが見つかりません');
    const title = data.name;
    const desc = data.description || '';
    const thumb = toYt3Avatar(data.avatarUrl || '', 176);
    const subs = data.subscriberCount || 0;
    app.innerHTML = `
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
        <img src="${thumb}" style="width:88px;height:88px;border-radius:50%">
        <div>
          <div style="font-weight:700;font-size:18px">${escapeHtml(title)}</div>
          <div style="color:#606060">${fmtNum(subs)} 人の登録者</div>
          <div style="margin-top:8px"><button class="btn-sub">登録</button></div>
        </div>
      </div>
      <div style="font-size:13px;color:#333;margin-bottom:12px">${escapeHtml(desc).slice(0,500)}${desc.length>500?'…':''}</div>
      <div style="font-weight:700;margin:12px 0">動画</div>
      <div class="video-grid" id="channelVideos"></div>
      <div id="channelSentinel" style="height:32px"></div>
    `;
    const grid = el('channelVideos');
    let loading = false;
    const loadMore = async () => {
      if (loading) return;
      loading = true;
      try {
        let rawVideos = [];
        let chData = null;
        chData = await pipedFetch(`/channel/${channelId}`);
        rawVideos = chData.relatedStreams || chData.latestVideos || chData.videos || [];
        if (rawVideos.length === 0) {
          try {
            const invData = await rawFetchJson(`${BASE_URL}/invidious/channel/${channelId}`, 12000);
            const normalized = normalizeInvidious(`/channel/${channelId}`, invData);
            rawVideos = normalized.relatedStreams || normalized.latestVideos || normalized.videos || [];
          } catch (e) {}
        }
        if (rawVideos.length === 0 && chData?.nextpage) {
          try {
            const nextData = await pipedFetch(`/nextpage/channel/${channelId}`, { nextpage: chData.nextpage });
            rawVideos = nextData.relatedStreams || nextData.videos || [];
          } catch (e) {}
        }
        if (rawVideos.length === 0) {
          grid.innerHTML += `<div style="padding:20px;color:#606060;">このチャンネルの動画を取得できませんでした</div>`;
          return;
        }
        const frag = document.createDocumentFragment();
        const cards = [];
        for (const v of rawVideos) {
          const card = makeVideoCard(v);
          cards.push(card);
          frag.appendChild(card);
        }
        grid.appendChild(frag);
        fillChannelThumbs(cards);
      } catch (e) {
        console.error('チャンネル動画取得エラー:', e);
        grid.innerHTML += `<div style="color:#c00">読み込み失敗: ${escapeHtml(e.message)}</div>`;
      } finally {
        loading = false;
      }
    };
    const sentinel = el('channelSentinel');
    const io = new IntersectionObserver(entries => {
      entries.forEach(ent => { if (ent.isIntersecting) loadMore(); });
    }, { rootMargin: '800px' });
    io.observe(sentinel);
    observerMap.set(`channel_${channelId}`, io);
    loadMore();
  } catch (e) {
    app.innerHTML = `<div style="color:#c00">チャンネル読み込み失敗: ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s = '') {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function toggleFixedSidebar(show = null) {
  const fixedSidebar = document.getElementById('sidebarFixed');
  const contentMain = document.querySelector('.content-main');
  if (!fixedSidebar || !contentMain) return;
  if (show === true) fixedSidebar.classList.remove('hidden');
  else if (show === false) fixedSidebar.classList.add('hidden');
  else fixedSidebar.classList.toggle('hidden');
  if (fixedSidebar.classList.contains('hidden')) {
    contentMain.style.setProperty('margin-left', '0', 'important');
    document.body.classList.add('sidebar-hidden');
  } else {
    contentMain.style.setProperty('margin-left', '72px', 'important');
    document.body.classList.remove('sidebar-hidden');
  }
}

function updateSidebarActive() {
  const hash = location.hash.slice(1);

  items.forEach(item => {
    item.classList.remove('active');

    else if (hash === 'tools' && target === 'tools') item.classList.add('active');
    else if (hash === 'history' && target === 'history') item.classList.add('active');
    else if (hash === 'settings' && target === 'settings') item.classList.add('active');
  });
}

const HISTORY_KEY = 'kTube_watch_history';
const MAX_HISTORY = 50;

function addToHistory(videoId, title, thumbnail, uploaderName, uploaderUrl) {
  if (!videoId || !title) return;
  let history = getHistory();
  history = history.filter(item => item.videoId !== videoId);
  history.unshift({
    videoId, title: title || '（タイトル不明）', thumbnail: thumbnail || '',
    uploaderName: uploaderName || '不明', uploaderUrl: uploaderUrl || '',
    watchedAt: new Date().toISOString()
  });
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}
function getHistory() {
  try { const data = localStorage.getItem(HISTORY_KEY); return data ? JSON.parse(data) : []; }
  catch (e) { console.warn('履歴の読み込みに失敗しました', e); return []; }
}
function clearHistory() { localStorage.removeItem(HISTORY_KEY); renderHistory(); }

        <label class="setting-label"><input type="checkbox" id="autoClearHistory" ${settings.autoClearHistory ? 'checked' : ''}>30日以上前の履歴を自動削除</label>
        <button id="clearAllHistoryBtn" class="danger-btn" style="margin-top:16px;">すべての履歴を今すぐ削除</button>
      </div>
      <div class="setting-group">
        <h2>言語</h2>
        <select id="languageSelect">
          <option value="ja" ${settings.language === 'ja' ? 'selected' : ''}>日本語</option>
          <option value="en" ${settings.language === 'en' ? 'selected' : ''}>English</option>
        </select>
      </div>
      <div class="setting-group" style="border-top:1px solid #eee; padding-top:24px;">
        <h2>データリセット</h2>
        <button id="clearCacheBtn" class="danger-btn">すべての設定とデータをリセット（キャッシュクリア）</button>
        <p style="font-size:13px; color:#c00; margin-top:8px;">※この操作は元に戻せません。アプリが再読み込みされます。</p>
      </div>
      <div style="text-align:center; margin:48px 0; color:#606060; font-size:14px;">
        K-tube light バージョン 2.32
        <br>© 2025-2026
      </div>
    </section>`;

  document.getElementById('darkModeToggle')?.addEventListener('change', e => {
    localStorage.setItem('darkMode', e.target.checked);
    document.body.classList.toggle('dark-mode', e.target.checked);
  });
  document.getElementById('autoPlayToggle')?.addEventListener('change', e => localStorage.setItem('autoPlay', e.target.checked));
  document.getElementById('defaultQualitySelect')?.addEventListener('change', e => localStorage.setItem('defaultQuality', e.target.value));
  document.getElementById('defaultPlayerSelect')?.addEventListener('change', e => {
    localStorage.setItem('defaultPlayer', e.target.value);
    alert('デフォルト再生方法を変更しました。\n次に開く動画から新しい設定が適用されます。');
  });
  document.getElementById('defaultRegionSelect')?.addEventListener('change', e => localStorage.setItem('defaultRegion', e.target.value));
  document.getElementById('commentSortSelect')?.addEventListener('change', e => localStorage.setItem('commentSort', e.target.value));
  document.getElementById('notificationsToggle')?.addEventListener('change', async e => {
    const enabled = e.target.checked;
    if (enabled && Notification.permission === 'default') {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { e.target.checked = false; alert('通知が許可されませんでした'); return; }
    }
    localStorage.setItem('notifications', enabled);
  });
  document.getElementById('playlistToggle')?.addEventListener('change', e => localStorage.setItem('playlistEnabled', e.target.checked));
  document.getElementById('autoClearHistory')?.addEventListener('change', e => localStorage.setItem('autoClearHistory', e.target.checked));
  document.getElementById('languageSelect')?.addEventListener('change', e => {
    localStorage.setItem('language', e.target.value);
    alert('言語変更は次回リロード後に反映されます（現在準備中）');
  });
  document.getElementById('clearAllHistoryBtn')?.addEventListener('click', () => {
    if (confirm('すべての再生履歴を削除しますか？この操作は元に戻せません。')) { clearHistory(); alert('履歴をすべて削除しました'); }
  });
  document.getElementById('clearCacheBtn')?.addEventListener('click', () => {
    if (confirm('すべての設定・履歴・キャッシュを削除しますか？アプリが再読み込みされます。')) {
      localStorage.clear(); location.reload();
    }
  });
}

/* ============================================================
   play.js（inline）
   ============================================================ */
async function loadGames() {
  const grid = document.getElementById('gameGrid');
  if (!grid) return;
  try {
    const res = await fetch(`${BASE_URL}/Games.json`);
    if (!res.ok) throw new Error('Games.json 読み込み失敗');
    const data = await res.json();
    const games = data.games || [];
    const frag = document.createDocumentFragment();
    for (const game of games) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb" data-game="${game.embedUrl}">
          <img src="${game.thumbnail}" alt="${escapeHtml(game.title)}" loading="lazy" decoding="async" style="aspect-ratio:16/9; object-fit:cover;">
        </div>
        <div class="meta">
          <div class="info">
            <div class="title">${escapeHtml(game.title)}</div>
            <div class="sub">${escapeHtml(game.description || '')}</div>
          </div>
        </div>`;
      card.querySelector('.thumb').addEventListener('click', () => {
        location.hash = `playgame=${encodeURIComponent(game.embedUrl)}`;
      });
      frag.appendChild(card);
    }
    grid.innerHTML = '';
    grid.appendChild(frag);
  } catch (err) {
    console.error('ゲーム一覧読み込みエラー:', err);
    grid.innerHTML = `<div style="color:#c00;padding:40px;text-align:center;">ゲーム一覧の読み込みに失敗しました</div>`;
  }
}

function renderGamePlay(game) {
  app.innerHTML = `
    <div class="play-fullscreen">
      <iframe src="${resolveEmbedUrl(game.embedUrl)}" frameborder="0" allowfullscreen></iframe>
    </div>`;
}
window.loadGames = loadGames;
window.renderGamePlay = renderGamePlay;

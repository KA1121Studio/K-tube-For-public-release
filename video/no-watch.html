<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>見れないよーん</title>
<style>
  body {
    margin: 0;
    height: calc(100vh / 1.5); /* ズーム分を割って中央ずれを防ぐ */
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    font-family: "MS Gothic", sans-serif;
    background: linear-gradient(
      45deg,
      #ff0000, #ff8800, #ffff00, #00ff00,
      #00ffff, #0000ff, #ff00ff, #ff0000
    );
    background-size: 400% 400%;
    animation: rainbowFlow 3s linear infinite, rainbowFlash 1.2s ease-in-out infinite;
    zoom: 1.5; /* ブラウザ150%相当 */
  }

  /* 背景の上に光るオーバーレイ */
  body::before {
    content: "";
    position: absolute;
    inset: -20%;
    background: radial-gradient(circle at 50% 50%,
      rgba(255,255,255,0.9) 0%,
      rgba(255,255,255,0.4) 20%,
      rgba(255,255,255,0) 60%);
    animation: glowPulse 1.2s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes rainbowFlow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }
  @keyframes rainbowFlash {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.8); }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  /* 中央ボックス：白いギザギザ枠＋内側が逆方向に光る */
  .center-box {
    position: relative;
    z-index: 10;
    padding: 70px 80px;
    text-align: center;
    clip-path: polygon(
      50% 0%, 58% 10%, 68% 4%, 72% 16%, 84% 14%, 84% 26%,
      96% 30%, 90% 42%, 100% 50%, 90% 58%, 96% 70%, 84% 74%,
      84% 86%, 72% 84%, 68% 96%, 58% 90%, 50% 100%, 42% 90%,
      32% 96%, 28% 84%, 16% 86%, 16% 74%, 4% 70%, 10% 58%,
      0% 50%, 10% 42%, 4% 30%, 16% 26%, 16% 14%, 28% 16%,
      32% 4%, 42% 10%
    );
    background: white;
    animation: boxGlow 1.2s ease-in-out infinite;
  }

  /* 内側の黒いギザギザ（少し小さくして白い縁を残す） */
  .center-box::before {
    content: "";
    position: absolute;
    inset: 10px;
    clip-path: polygon(
      50% 0%, 58% 10%, 68% 4%, 72% 16%, 84% 14%, 84% 26%,
      96% 30%, 90% 42%, 100% 50%, 90% 58%, 96% 70%, 84% 74%,
      84% 86%, 72% 84%, 68% 96%, 58% 90%, 50% 100%, 42% 90%,
      32% 96%, 28% 84%, 16% 86%, 16% 74%, 4% 70%, 10% 58%,
      0% 50%, 10% 42%, 4% 30%, 16% 26%, 16% 14%, 28% 16%,
      32% 4%, 42% 10%
    );
    background: linear-gradient(
      45deg,
      #ff0000, #ff8800, #ffff00, #00ff00,
      #00ffff, #0000ff, #ff00ff, #ff0000
    );
    background-size: 400% 400%;
    animation: innerFlowReverse 3s linear infinite, innerFlash 1.2s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes innerFlowReverse {
    0%   { background-position: 400% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes innerFlash {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.8); }
  }
  @keyframes boxGlow {
    0%, 100% {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #00ff00);
    }
    50% {
      filter: drop-shadow(0 0 25px #fff) drop-shadow(0 0 50px #ff00ff);
    }
  }

  /* 中央メッセージ（白文字＋発光） */
  .center-box .main {
    position: relative;
    z-index: 1;
    font-size: 2.5rem;
    color: #fff;
    font-weight: bold;
    line-height: 1.5;
    text-shadow:
      0 0 8px #000,
      0 0 12px #000,
      0 0 20px #fff,
      0 0 30px #ffff00;
    animation: textGlow 1s ease-in-out infinite alternate;
  }

  @keyframes textGlow {
    from { text-shadow: 0 0 8px #000, 0 0 12px #000, 0 0 20px #fff, 0 0 30px #ffff00; }
    to   { text-shadow: 0 0 10px #000, 0 0 16px #000, 0 0 30px #fff, 0 0 45px #ff00ff; }
  }

  /* 周囲の煽り文句（発光付き） */
  .taunt {
    position: absolute;
    color: white;
    font-weight: bold;
    -webkit-text-stroke: 2px black;
    font-size: 1.5rem;
    background: #0000ff;
    padding: 5px 10px;
    border: 3px solid yellow;
    z-index: 5;
    text-shadow:
      0 0 6px #fff,
      0 0 12px currentColor,
      0 0 20px #fff;
  }

  .t1 { top:5%;  left:5%;  animation: float 3s ease-in-out infinite, blink 2s step-end infinite, tauntGlow 1s ease-in-out infinite alternate; }
  .t2 { top:10%; left:70%; background:#ff0000; animation: float 4s ease-in-out infinite reverse, blink 1.5s step-end infinite, tauntGlow 1.2s ease-in-out infinite alternate; }
  .t3 { top:30%; left:2%;  background:#008000; animation: spin 6s linear infinite, tauntGlow 0.9s ease-in-out infinite alternate; }
  .t4 { top:25%; left:80%; background:#ff8800; animation: bounce 2s ease-in-out infinite, tauntGlow 1.1s ease-in-out infinite alternate; }
  .t5 { bottom:10%; left:10%; background:#800080; animation: wobble 3s ease-in-out infinite, tauntGlow 1.3s ease-in-out infinite alternate; }
  .t6 { bottom:5%;  left:75%; background:#00ffff; color:black; -webkit-text-stroke:0; animation: pulse 2.5s ease-in-out infinite, tauntGlow 1s ease-in-out infinite alternate; }
  .t7 { top:50%;  left:0%;  background:#ff00ff; animation: shake 0.6s infinite, tauntGlow 0.8s ease-in-out infinite alternate; }
  .t8 { top:55%;  right:0%; background:#000080; animation: float 5s ease-in-out infinite, tauntGlow 1.4s ease-in-out infinite alternate; }

  @keyframes tauntGlow {
    from { filter: brightness(1) drop-shadow(0 0 4px #fff); }
    to   { filter: brightness(1.5) drop-shadow(0 0 14px #fff); }
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-15px); }
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.3; }
  }
  @keyframes spin {
    0%   { transform: rotate(-10deg); }
    50%  { transform: rotate(10deg); }
    100% { transform: rotate(-10deg); }
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    30%     { transform: translateY(-20px); }
    60%     { transform: translateY(5px); }
  }
  @keyframes wobble {
    0%,100% { transform: rotate(0deg); }
    25%     { transform: rotate(8deg); }
    75%     { transform: rotate(-8deg); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.2); }
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(2px,-2px); }
    50%     { transform: translate(-2px,2px); }
    75%     { transform: translate(2px,2px); }
  }
</style>
</head>
<body>
  <div class="taunt t1">ざんねーん</div>
  <div class="taunt t2">見れないよーん</div>
  <div class="taunt t3">あきらめて</div>
  <div class="taunt t4">無理無理</div>
  <div class="taunt t5">しつこいなあ</div>
  <div class="taunt t6">だから無理</div>
  <div class="taunt t7">なんで押すの</div>
  <div class="taunt t8">もう帰って</div>

  <div class="center-box">
    <div class="main">ざんねーん<br>その動画は見れないよーん</div>
  </div>

  <script>
(function () {
  let buffer = '';

  document.addEventListener('keydown', (e) => {
    // Enter で判定
    if (e.key === 'Enter') {
      const cmd = buffer.trim().toLowerCase();
      buffer = '';

      if (cmd === 'go()' || cmd === 'go') {
        // 親ウィンドウに通知
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'ktube-no-watch-bypass' }, '*');
          }
        } catch (err) {
          console.error('postMessage failed:', err);
        }
        return;
      }
      return;
    }

    // 1文字入力（バックスペース対応）
    if (e.key === 'Backspace') {
      buffer = buffer.slice(0, -1);
      return;
    }

    // 印字可能文字のみ追加
    if (e.key.length === 1) {
      buffer += e.key;
    }
  });
})();
</script>
  
</body>
</html>
